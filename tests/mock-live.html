<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>mock live page</title>
<style>
  html, body { margin: 0; background: #0a0a0f; color: #bbb; font: 13px/1.6 system-ui, sans-serif; }
  #barbox { padding: 10px 14px; color: #777; }
  #live-player {
    position: relative; width: 1024px; height: 576px; margin: 10px auto;
    background: #000; border-radius: 10px; overflow: hidden;
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bili-danmaku { position: absolute; inset: 0; pointer-events: none; }
  .bili-danmaku span {
    position: absolute; white-space: nowrap; color: #fff; font-weight: 600;
    font-size: 16px; text-shadow: 0 0 4px #000;
  }
</style>
</head>
<body>

<div id="barbox">
  mock 直播间：真实可播放的 &lt;video&gt; + 弹幕层。字幕出现即说明 content.js 的定位与渲染正常。
  <div id="dbg" style="margin-top:6px;font-family:ui-monospace,monospace;font-size:11px;color:#7fd4a0;white-space:pre-wrap"></div>
</div>

<div id="live-player">
  <video id="v" playsinline autoplay muted></video>
  <div class="bili-danmaku" id="dm"></div>
</div>

<script>
/* 1) 打桩 chrome API，让 content.js 以为自己在真实扩展里 */
const QS = new URLSearchParams(location.search);
const num = (k, d) => (QS.has(k) ? Number(QS.get(k)) : d);
const CFG = {
  enabled: true, serverMode: 'auto',
  fontSize: num('fs', 26),      // ?fs=44 试大字号
  maxLines: num('ml', 3),
  showJa: QS.get('ja') !== '0',
  bottomPct: num('bp', 11),     // ?bp=28 试抬高位
  delay: num('delay', 0)        // ?delay=10 试延迟补偿
};
const ROOM = (location.pathname.match(/^\/(\d{1,12})/) || [])[1] || '';
const SUPPORTED = ['22748536', '21399689'].includes(ROOM);
let listener = null;

window.chrome = {
  runtime: {
    lastError: null,
    sendMessage(msg, cb) {
      if (cb) {
        cb({
          ok: true, cfg: CFG,
          supported: SUPPORTED,
          serving: SUPPORTED,
          state: {
            sse: 'open', activeRoom: SUPPORTED ? ROOM : '', activeId: 'hy1',
            health: {}, lastError: '', meta: null,
            rooms: ['22748536', '21399689'], roomMeta: {}
          }
        });
      }
    },
    onMessage: { addListener(fn) { listener = fn; } }
  }
};

/* 2) canvas → MediaStream，产生带尺寸的可播放 video */
const cv = document.createElement('canvas');
cv.width = 1280; cv.height = 720;
const cx = cv.getContext('2d');

function paint(t) {
  const g = cx.createLinearGradient(0, 0, 1280, 720);
  g.addColorStop(0, '#1a2340'); g.addColorStop(0.5, '#241a33'); g.addColorStop(1, '#10202a');
  cx.fillStyle = g; cx.fillRect(0, 0, 1280, 720);
  for (let i = 0; i < 5; i++) {
    const a = t / 2000 + i * 1.3;
    cx.beginPath();
    cx.arc(640 + Math.cos(a) * 320, 360 + Math.sin(a * 1.4) * 190, 130, 0, Math.PI * 2);
    cx.fillStyle = 'rgba(' + (80 + i * 30) + ',' + (110 + i * 18) + ',255,0.14)';
    cx.fill();
  }
  cx.fillStyle = 'rgba(255,255,255,0.14)';
  cx.font = '600 22px sans-serif'; cx.textAlign = 'center';
  cx.fillText('MOCK LIVE STREAM · bilibili player area', 640, 360);
  requestAnimationFrame(paint);
}
requestAnimationFrame(paint);

const video = document.getElementById('v');
video.srcObject = cv.captureStream(12);
video.play().catch(function () {});

/* 3) 几条假弹幕，用来确认字幕压在弹幕之上 */
['老板大气', '哈哈哈哈', '这个反应笑死', '火羽辛苦啦', '草'].forEach(function (t, i) {
  const s = document.createElement('span');
  s.textContent = t;
  s.style.top = (18 + i * 13) + '%';
  s.style.left = (12 + i * 15) + '%';
  document.getElementById('dm').appendChild(s);
});

/* 4) 注入被测脚本 */
const sc = document.createElement('script');
sc.src = '../content.js';
document.body.appendChild(sc);

/* 5) 模拟 SSE 推送 */
const SAMPLE = [
  { ja: 'みんな、こんばんは！今日も配信見に来てくれてありがとう', zh: '大家晚上好！今天也谢谢你们来看直播' },
  { ja: 'ちょっと待って、今マイクの調子が悪いみたい', zh: '等一下，麦克风好像有点问题' },
  { ja: 'あ、治った！じゃあ始めようか', zh: '啊，好了！那我们开始吧' }
];

let seq = 1;
function emit(line) {
  if (!listener) return;
  listener({ target: 'content', kind: 'sse', data: { type: 'line', line: Object.assign({ id: seq++ }, line) } });
}

/* ?snap=1：改用 snapshot 一次性灌入，且带上真实感的时间戳（每 2 秒一条），
   用来验证历史字幕是否也受延迟窗口约束 */
function emitSnapshot() {
  if (!listener) return;
  const now = Date.now() / 1000;
  const arr = SAMPLE.map(function (s, i) {
    return {
      id: 100 + i,
      ja: s.ja,
      zh: s.zh,
      ts: now - (SAMPLE.length - 1 - i) * 2,
      t: '',
      el: 0
    };
  });
  listener({
    target: 'content', kind: 'sse',
    data: { type: 'snapshot', lines: arr, dms: [], connected: true,
            room: { id: Number(ROOM), name: 'mock' }, live: { live: 1 } }
  });
}

const USE_SNAP = QS.get('snap') === '1';

/* 把实际生效的定位参数打到页面上，方便排查排版问题 */
function dumpDebug() {
  const h = document.getElementById('hy-live-sub-host');
  const sr = h && h.shadowRoot;
  const w = sr && sr.querySelector('.wrap');
  const v = document.getElementById('v');
  const rows = sr ? sr.querySelectorAll('.row').length : 0;
  const dbg = document.getElementById('dbg');
  if (!dbg) return;
  if (!h || !w) {
    dbg.textContent = 'overlay: 未创建（active=false？）';
    return;
  }
  const hr = h.getBoundingClientRect();
  const wr = w.getBoundingClientRect();
  const ws = getComputedStyle(w);
  const hs = getComputedStyle(h);
  dbg.textContent = [
    'video  ' + Math.round(v.getBoundingClientRect().height) + 'px 高',
    'host   ' + Math.round(hr.width) + '×' + Math.round(hr.height) +
      '  top=' + Math.round(hr.top) + '  bottom=' + Math.round(hr.bottom),
    'host   position=' + hs.position + '  contain=' + hs.contain,
    'wrap   position=' + ws.position + '  bottom=' + ws.bottom +
      '  offsetParent=' + (w.offsetParent ? w.offsetParent.tagName : 'null'),
    '--hy-size=' + (h.style.getPropertyValue('--hy-size') || '(空)') +
      '  --hy-bottom=' + (h.style.getPropertyValue('--hy-bottom') || '(空)'),
    'wrap   rect top=' + Math.round(wr.top) + ' bottom=' + Math.round(wr.bottom) +
      ' 行数=' + rows + '  innerHeight=' + window.innerHeight
  ].join('\n');
}

function settle() {
  const h = document.getElementById('hy-live-sub-host');
  if (h && h.shadowRoot) {
    h.shadowRoot.querySelectorAll('.row').forEach(function (r) {
      r.style.animation = 'none';
      r.style.opacity = '1';
    });
  }
  dumpDebug();
  document.title = 'READY';
}

setTimeout(function () {
  if (USE_SNAP) {
    emitSnapshot();
    setTimeout(settle, 600);
    return;
  }

  emit(SAMPLE[0]);
  setTimeout(function () { emit(SAMPLE[1]); }, 400);
  setTimeout(function () {
    emit(SAMPLE[2]);
    setTimeout(settle, 500);
  }, 900);

  // ?cfgdelay=8：加载后中途改一次 delay，模拟用户在设置面板拖动滑块
  const cfgDelay = QS.get('cfgdelay');
  if (cfgDelay != null) {
    setTimeout(function () {
      if (listener) {
        listener({
          target: 'content', kind: 'cfg',
          cfg: Object.assign({}, CFG, { delay: Number(cfgDelay) })
        });
      }
      setTimeout(dumpDebug, 200);
    }, 2500);
  }
}, 700);
</script>

</body>
</html>
